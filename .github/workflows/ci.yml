name: API Test Suite

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install and start the mock server
        working-directory: mock-server
        run: |
          npm install
          nohup node server.js > server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf -X POST http://localhost:3000/v1/auth/login \
              -H "Content-Type: application/json" -d '{"username":"ci","apiKey":"ci"}' \
              && echo "mock server is up" && break
            sleep 1
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff black

      - name: Lint
        run: |
          ruff check .
          black --check .

      - name: Contract check (fails fast if the mock server's response shape drifted)
        run: python scripts/validate_contract.py

      - name: Fast suite (parallel, excludes real-time async waits)
        run: pytest -n auto -m "not slow" --html-report=reports/report-fast.html

      - name: Full suite (includes real ~5s/15s/60s async waits)
        run: pytest --html-report=reports/report-full.html

      - name: Upload HTML reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-reports
          path: reports/**/*.html
