[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["step_definitions"]
markers = [
    "smoke: fast, high-value checks safe to run on every PR",
    "orders: tests covering the /orders endpoints",
    "exports: tests covering the /exports endpoints",
    "auth: tests covering the /auth endpoints",
    "api: scenarios verifying the API response contract",
    "regression: broader negative/edge-case coverage",
    "validation: payload/field validation failures",
    "boundary: edge-of-input scenarios",
    "happy: happy-path scenarios",
    "invariant: properties that must hold for any valid input",
    "property: hypothesis-driven property tests",
    "slow: tests that wait out real async timing (roughly 15-75s) -- excluded from smoke runs",
    "title(text): human-readable test case title rendered in the HTML report",
]
addopts = "-ra --strict-markers"

# Logging. `log_cli` stays off so a green run is quiet; pytest captures every
# record and replays it under "Captured log" on a failure. The report plugin
# points `log_file` at <report dir>/run.log per run, so a full DEBUG-level
# trace of every request is always on disk (and uploaded by CI), even for the
# runs that passed.
log_level = "INFO"
log_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_date_format = "%Y-%m-%d %H:%M:%S"
log_cli = false
log_file_level = "DEBUG"
log_file_format = "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
log_file_date_format = "%Y-%m-%d %H:%M:%S"

[tool.ruff]
line-length = 100

[tool.black]
line-length = 100
