# Template for a staging deployment of the same mock service, if one existed.
# No secrets committed -- every value is env-driven with a safe fallback.
env=stg
base_url=${LIGHTBEAM_STG_BASE_URL:-https://stg.example.invalid/v1}
request_timeout_seconds=${REQUEST_TIMEOUT_SECONDS:-10}

order_poll_interval_seconds=${ORDER_POLL_INTERVAL_SECONDS:-1}
order_poll_timeout_seconds=${ORDER_POLL_TIMEOUT_SECONDS:-25}
export_poll_interval_seconds=${EXPORT_POLL_INTERVAL_SECONDS:-2}
export_poll_timeout_seconds=${EXPORT_POLL_TIMEOUT_SECONDS:-75}
