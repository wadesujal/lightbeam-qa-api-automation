# Template only -- this assignment has no real production target.
# Kept for parity with the per-environment config layout so adding a real
# environment later is a new properties file, not a code change.
env=prd
base_url=${LIGHTBEAM_PRD_BASE_URL:-https://prd.example.invalid/v1}
request_timeout_seconds=${REQUEST_TIMEOUT_SECONDS:-10}

order_poll_interval_seconds=${ORDER_POLL_INTERVAL_SECONDS:-1}
order_poll_timeout_seconds=${ORDER_POLL_TIMEOUT_SECONDS:-25}
export_poll_interval_seconds=${EXPORT_POLL_INTERVAL_SECONDS:-2}
export_poll_timeout_seconds=${EXPORT_POLL_TIMEOUT_SECONDS:-75}

# How long to keep observing a CANCELLED order to prove it never advances.
# Must exceed the server's PROCESSING->COMPLETED threshold (15s) to be meaningful.
cancelled_observation_seconds=${CANCELLED_OBSERVATION_SECONDS:-18}
